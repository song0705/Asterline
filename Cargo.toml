[package]
name = "asterline"
version = "1.0.1"
edition = "2024"
rust-version = "1.88"
default-run = "asterline"
description = "Local-first terminal workspace for coordinating coding agents"
license = "MIT"
repository = "https://github.com/song0705/Asterline"
homepage = "https://github.com/song0705/Asterline"
readme = "README.md"
keywords = ["ai", "cli", "multi-agent", "terminal", "tui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
crossterm = { version = "0.29", features = ["osc52"] }
portable-pty = "0.9"
pulldown-cmark = { version = "0.12", default-features = false }
ratatui = "0.30.2"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
uuid = { version = "1.23.3", features = ["v4"] }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
semver = "1.0"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
