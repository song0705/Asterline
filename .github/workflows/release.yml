name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version without the v prefix (must match Cargo.toml)"
        required: true
        type: string

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release preflight v{0}', inputs.version) || format('Release {0}', github.ref_name) }}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Verify release source
    runs-on: ubuntu-24.04
    outputs:
      tag_object: ${{ steps.provenance.outputs.tag_object }}
      release_tag: ${{ steps.provenance.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Verify tag provenance and publication state
        id: provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            test "$PREFLIGHT_VERSION" = "$version"
            release_tag="v$version"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            test -z "$(git tag --list "$release_tag")"
            ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1
            printf 'tag_object=\n' >> "$GITHUB_OUTPUT"
          else
            release_tag="$GITHUB_REF_NAME"
            test "$release_tag" = "v$version"
            test "$(git cat-file -t "refs/tags/$release_tag")" = tag
            tagged_commit=$(git rev-parse "refs/tags/$release_tag^{commit}")
            test "$tagged_commit" = "$GITHUB_SHA"
            git merge-base --is-ancestor "$tagged_commit" origin/main
            tag_object=$(git rev-parse "refs/tags/$release_tag")
            remote_tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" --jq .object.sha)
            test "$remote_tag_object" = "$tag_object"
            printf 'tag_object=%s\n' "$tag_object" >> "$GITHUB_OUTPUT"
            preflight_count=$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs?event=workflow_dispatch&head_sha=$GITHUB_SHA&status=completed&per_page=100" \
              | jq --slurp '[.[] | .workflow_runs[] | select(.path == ".github/workflows/release.yml" and .conclusion == "success")] | length')
            if test "$preflight_count" -lt 1; then
              echo "A successful Release preflight for $GITHUB_SHA is required before pushing $release_tag." >&2
              exit 1
            fi
          fi
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          releases="$RUNNER_TEMP/asterline-releases.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq --slurp --arg tag "$release_tag" \
              '[.[][] | select(.tag_name == $tag)]' > "$releases"
          test "$(jq length "$releases")" -le 1
          if test "$(jq length "$releases")" -eq 1; then
            if test "$(jq -r '.[0].draft' "$releases")" = false; then
              echo "A published release already exists for $release_tag; published version tags are never reused." >&2
              exit 1
            fi
            echo "An incomplete draft exists for $release_tag; publish will replace it after every gate passes."
          fi
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit
      - name: Require the Homebrew tap credential
        if: github.event_name == 'push'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$HOMEBREW_TAP_TOKEN"

  quality-platforms:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test all targets
        run: cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [quality, quality-platforms]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          package="asterline-${version}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/asterline" "dist/$package/"
          cp "target/${{ matrix.target }}/release/ast" "dist/$package/"
          cp LICENSE README.md README.zh-CN.md "dist/$package/"
          strip "dist/$package/asterline" "dist/$package/ast"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          rm -rf "dist/$package"
      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $package = "asterline-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/asterline.exe" "dist/$package/"
          Copy-Item "target/${{ matrix.target }}/release/ast.exe" "dist/$package/"
          Copy-Item LICENSE, README.md, README.zh-CN.md "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          Remove-Item -Recurse -Force "dist/$package"
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          ./scripts/build-windows-installer.ps1 -Version $version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  build-linux:
    name: Build ${{ matrix.target }} · glibc 2.28
    needs: [quality, quality-platforms]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            release_arch: x86_64
            image: quay.io/pypa/manylinux_2_28_x86_64@sha256:f854c50adf7b7a325bc4794316f3758d387a41d61f9e2ebca0f26c7dc8f761d4
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            release_arch: arm64
            image: quay.io/pypa/manylinux_2_28_aarch64@sha256:b9dd5b2d6885fae144119ac934978003bcc413087ea08f602a960257205ec246
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
    container:
      image: ${{ matrix.image }}
    steps:
      # checkout v7 and the other JavaScript actions use Node 24, whose Linux
      # binaries support this glibc baseline. Keep this shell-only preflight
      # before the first JavaScript action so missing image tools fail clearly.
      - name: Verify manylinux container prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.28"
          for tool in ar bash cc curl git objdump readelf strip tar; do
            command -v "$tool"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}-glibc-2.28
      - name: Build release binaries
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Verify bundled SQLite and glibc baseline
        shell: bash
        run: ./scripts/verify-linux-release.sh "${{ matrix.target }}" 2.28
      - name: Package release archive
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          archive_root="asterline-${version}-${{ matrix.target }}"
          mkdir -p "dist/$archive_root"
          cp "target/${{ matrix.target }}/release/asterline" "dist/$archive_root/"
          cp "target/${{ matrix.target }}/release/ast" "dist/$archive_root/"
          cp LICENSE README.md README.zh-CN.md "dist/$archive_root/"
          strip "dist/$archive_root/asterline" "dist/$archive_root/ast"
          tar -C dist -czf "dist/asterline-v${version}-Linux-${{ matrix.release_arch }}.tar.gz" "$archive_root"
          rm -rf "dist/$archive_root"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  package-debian:
    name: Package Debian / Ubuntu Linux ${{ matrix.release_arch }}
    needs: [quality, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            release_arch: x86_64
            image: debian@sha256:41a613df4beca480a97c22b1f6837f7502cb95206e2cc2daf1ea3cb28f8755ab
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            release_arch: arm64
            image: debian@sha256:4466bf7af8c14212301aa7b61cb9504f97041992e541eaad4af4ded52308037c
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install Debian package tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            ca-certificates \
            dpkg-dev \
            git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/input
      - name: Build Debian package from verified Linux archive
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          archive="dist/input/asterline-v$version-Linux-${{ matrix.release_arch }}.tar.gz"
          ./scripts/package-deb.sh \
            "$version" \
            "${{ matrix.target }}" \
            "${{ matrix.deb_arch }}" \
            "$archive" \
            dist
      - name: Smoke test Debian package installation
        shell: bash
        run: |
          set -euo pipefail
          package="dist/asterline-v${RELEASE_TAG#v}-Linux-${{ matrix.release_arch }}.deb"
          ./scripts/smoke-deb-package.sh "$package" "${{ matrix.deb_arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-deb-${{ matrix.release_arch }}
          path: dist/*.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  smoke-deb-ubuntu:
    name: Smoke test Ubuntu Linux package ${{ matrix.release_arch }}
    needs: [quality, package-debian]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            deb_arch: amd64
            release_arch: x86_64
          - runner: ubuntu-24.04-arm
            deb_arch: arm64
            release_arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-deb-${{ matrix.release_arch }}
          path: dist
      - name: Install, run, and purge Debian package on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          package="dist/asterline-v${RELEASE_TAG#v}-Linux-${{ matrix.release_arch }}.deb"
          ./scripts/smoke-deb-package.sh "$package" "${{ matrix.deb_arch }}"

  package-rpm:
    name: Package RPM Linux ${{ matrix.release_arch }}
    needs: [quality, build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            rpm_arch: x86_64
            release_arch: x86_64
            image: rockylinux/rockylinux:8@sha256:f5529992e67440c1a4ae7788244d4381c6909159a88eacd95b7523ae47ced82e
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            rpm_arch: aarch64
            release_arch: arm64
            image: rockylinux/rockylinux:8@sha256:f514765516176a9aa4729ee83964e5a1900df95fd4bc7182cca64c7199b7eec7
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install RPM package tools
        shell: bash
        run: |
          set -euo pipefail
          dnf install --assumeyes \
            ca-certificates \
            findutils \
            git \
            rpm-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/input
      - name: Build RPM package from verified Linux archive
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          archive="dist/input/asterline-v$version-Linux-${{ matrix.release_arch }}.tar.gz"
          ./scripts/package-rpm.sh \
            "$version" \
            "${{ matrix.target }}" \
            "${{ matrix.rpm_arch }}" \
            "$archive" \
            dist
      - name: Smoke test RPM package installation
        shell: bash
        run: |
          set -euo pipefail
          package="dist/asterline-v${RELEASE_TAG#v}-Linux-${{ matrix.release_arch }}.rpm"
          ./scripts/smoke-rpm-package.sh "$package" "${{ matrix.rpm_arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rpm-${{ matrix.release_arch }}
          path: dist/*.rpm
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  smoke-rpm-fedora:
    name: Smoke test Fedora RPM ${{ matrix.release_arch }}
    needs: [quality, package-rpm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            rpm_arch: x86_64
            release_arch: x86_64
            image: fedora:44@sha256:89f61a124414261868224666aa7fb8df1b78397a53623774bdfb105d1612b48b
          - runner: ubuntu-24.04-arm
            rpm_arch: aarch64
            release_arch: arm64
            image: fedora:44@sha256:a471bd8bf8e7e99812fd2f29fc950685d860b3d528b9f090443dbc1a0d2bad62
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install Fedora smoke-test tools
        shell: bash
        run: |
          set -euo pipefail
          dnf install --assumeyes \
            ca-certificates \
            findutils \
            git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-rpm-${{ matrix.release_arch }}
          path: dist
      - name: Install, run, and remove RPM package on Fedora
        shell: bash
        run: |
          set -euo pipefail
          package="dist/asterline-v${RELEASE_TAG#v}-Linux-${{ matrix.release_arch }}.rpm"
          ./scripts/smoke-rpm-package.sh "$package" "${{ matrix.rpm_arch }}"

  package-macos:
    name: Package universal macOS DMG
    needs: [quality, build]
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ needs.quality.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-apple-darwin
          path: dist/macos-input
          merge-multiple: true
      - name: Prepare optional Developer ID signing
        id: signing
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          test -n "$CERTIFICATE_P12_BASE64" || missing+=(MACOS_CERTIFICATE_P12_BASE64)
          test -n "$CERTIFICATE_PASSWORD" || missing+=(MACOS_CERTIFICATE_PASSWORD)
          test -n "$APPLICATION_IDENTITY" || missing+=(MACOS_APPLICATION_IDENTITY)
          test -n "$INSTALLER_IDENTITY" || missing+=(MACOS_INSTALLER_IDENTITY)
          test -n "$NOTARY_KEY_P8_BASE64" || missing+=(APPLE_NOTARY_KEY_P8_BASE64)
          test -n "$NOTARY_KEY_ID" || missing+=(APPLE_NOTARY_KEY_ID)
          test -n "$NOTARY_ISSUER_ID" || missing+=(APPLE_NOTARY_ISSUER_ID)
          if test "${#missing[@]}" -ne 0; then
            printf '::warning::Publishing unsigned and unnotarized macOS DMG; missing: %s\n' "${missing[*]}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          encoded="$RUNNER_TEMP/asterline-certificate.txt"
          certificate="$RUNNER_TEMP/asterline-certificate.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" > "$encoded"
          base64 --decode -i "$encoded" -o "$certificate"
          keychain="$RUNNER_TEMP/asterline-signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "ASTERLINE_MACOS_APPLICATION_IDENTITY=$APPLICATION_IDENTITY" >> "$GITHUB_ENV"
          echo "ASTERLINE_MACOS_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "ASTERLINE_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Build universal installer DMG
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          x86_dir="$RUNNER_TEMP/asterline-x86_64"
          arm_dir="$RUNNER_TEMP/asterline-arm64"
          mkdir -p "$x86_dir" "$arm_dir"
          tar -xzf \
            "dist/macos-input/asterline-$version-x86_64-apple-darwin.tar.gz" \
            -C "$x86_dir" --strip-components 1
          tar -xzf \
            "dist/macos-input/asterline-$version-aarch64-apple-darwin.tar.gz" \
            -C "$arm_dir" --strip-components 1
          ./scripts/build-macos-dmg.sh \
            "$version" \
            "$x86_dir" \
            "$arm_dir" \
            "dist/asterline-$version-macos-universal.dmg"
      - name: Notarize and staple DMG
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          encoded="$RUNNER_TEMP/asterline-notary-key.txt"
          notary_key="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" > "$encoded"
          base64 --decode -i "$encoded" -o "$notary_key"
          version=${RELEASE_TAG#v}
          dmg="dist/asterline-$version-macos-universal.dmg"
          xcrun notarytool submit "$dmg" \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Smoke test DMG and package payload
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          dmg="dist/asterline-$version-macos-universal.dmg"
          mount_point="$RUNNER_TEMP/asterline-dmg"
          expanded="$RUNNER_TEMP/asterline-expanded-pkg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          pkg="$mount_point/Install Asterline.pkg"
          test -f "$pkg"
          pkgutil --expand-full "$pkg" "$expanded"
          for binary in ast asterline; do
            payload_binary="$expanded/Payload/usr/local/bin/$binary"
            test -x "$payload_binary"
            lipo "$payload_binary" -verify_arch x86_64 arm64
            "$payload_binary" --help > /dev/null
          done
          hdiutil detach "$mount_point"
          trap - EXIT
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if test -n "${ASTERLINE_MACOS_KEYCHAIN:-}"; then
            security delete-keychain "$ASTERLINE_MACOS_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: dist/*.dmg
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  smoke-windows-installer:
    name: Smoke test Windows Setup
    needs: [quality, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-x86_64-pc-windows-msvc
          path: dist
      - name: Install, run, update-wait, and uninstall
        shell: pwsh
        run: |
          $installer = (Resolve-Path "dist/asterline-*-x86_64-windows-setup.exe").Path
          ./scripts/smoke-windows-installer.ps1 -InstallerPath $installer

  publish:
    name: Publish GitHub Release
    needs: [quality, build, build-linux, package-debian, smoke-deb-ubuntu, package-rpm, smoke-rpm-fedora, package-macos, smoke-windows-installer]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Validate the exact release asset set
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          expected=(
            # macOS
            "asterline-$version-aarch64-apple-darwin.tar.gz"
            "asterline-$version-x86_64-apple-darwin.tar.gz"
            "asterline-$version-macos-universal.dmg"
            # GNU/Linux ARM64
            "asterline-v$version-Linux-arm64.tar.gz"
            "asterline-v$version-Linux-arm64.deb"
            "asterline-v$version-Linux-arm64.rpm"
            # GNU/Linux Intel / AMD 64-bit
            "asterline-v$version-Linux-x86_64.tar.gz"
            "asterline-v$version-Linux-x86_64.deb"
            "asterline-v$version-Linux-x86_64.rpm"
            # Windows
            "asterline-$version-x86_64-pc-windows-msvc.zip"
            "asterline-$version-x86_64-windows-setup.exe"
          )
          mapfile -t actual < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(printf '%s\n' "${actual[@]}")
          printf '%s\n' "${expected[@]}" > "$RUNNER_TEMP/release-assets.txt"
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          (
            cd dist
            sha256sum "${assets[@]}" > SHA256SUMS
          )
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
      - name: Rebuild a clean draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ needs.quality.outputs.tag_object }}
        run: |
          set -euo pipefail
          verify_tag() {
            ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
            test "$(jq -r .object.type <<< "$ref_json")" = tag
            remote_tag_object=$(jq -r .object.sha <<< "$ref_json")
            test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
            tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag_object")
            test "$(jq -r .object.type <<< "$tag_json")" = commit
            test "$(jq -r .object.sha <<< "$tag_json")" = "$GITHUB_SHA"
          }
          verify_tag
          releases="$RUNNER_TEMP/asterline-releases.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq --slurp --arg tag "$GITHUB_REF_NAME" \
              '[.[][] | select(.tag_name == $tag)]' > "$releases"
          test "$(jq length "$releases")" -le 1
          if test "$(jq length "$releases")" -eq 1; then
            if test "$(jq -r '.[0].draft' "$releases")" = false; then
              echo "Refusing to replace published release $GITHUB_REF_NAME." >&2
              exit 1
            fi
            tag_object_before=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
            tag_object_after=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
            test "$tag_object_after" = "$tag_object_before"
          fi
          # Draft deletion is itself a mutation. Rebind the ref and annotated
          # tag object once more immediately before creating its replacement.
          verify_tag
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if test -f "$notes_file"; then
            notes=(--notes-file "$notes_file")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            "${notes[@]}" \
            --title "Asterline $GITHUB_REF_NAME"
      - name: Upload every release asset to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          files=()
          for asset in "${assets[@]}"; do
            files+=("dist/$asset")
          done
          files+=(dist/SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY"
      - name: Verify draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          mapfile -t expected < <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          mapfile -t uploaded < <(
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | LC_ALL=C sort
          )
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${uploaded[@]}")
      - name: Publish the complete draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TAG_OBJECT: ${{ needs.quality.outputs.tag_object }}
        run: |
          set -euo pipefail
          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          test "$(jq -r .object.type <<< "$ref_json")" = tag
          remote_tag_object=$(jq -r .object.sha <<< "$ref_json")
          test "$remote_tag_object" = "$EXPECTED_TAG_OBJECT"
          tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$remote_tag_object")
          test "$(jq -r .object.type <<< "$tag_json")" = commit
          test "$(jq -r .object.sha <<< "$tag_json")" = "$GITHUB_SHA"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          test "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false

  update-homebrew:
    name: Open Homebrew Formula update
    needs: publish
    if: github.event_name == 'push'
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: song0705/homebrew-asterline
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-asterline
      - name: Download published Homebrew checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/homebrew-release"
          mkdir -p "$directory"
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS \
            --dir "$directory"
      - name: Update the Formula archives and checksums
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          checksums="$RUNNER_TEMP/homebrew-release/SHA256SUMS"
          checksum_for() {
            awk -v asset="$1" '
              $2 == asset { value = $1; count += 1 }
              END {
                if (count != 1 || length(value) != 64 || value !~ /^[0-9a-f]+$/) exit 1
                print value
              }
            ' "$checksums"
          }
          ruby scripts/update-homebrew-formula.rb \
            homebrew-asterline/Formula/asterline.rb \
            "$version" \
            "$(checksum_for "asterline-$version-aarch64-apple-darwin.tar.gz")" \
            "$(checksum_for "asterline-$version-x86_64-apple-darwin.tar.gz")" \
            "$(checksum_for "asterline-v$version-Linux-arm64.tar.gz")" \
            "$(checksum_for "asterline-v$version-Linux-x86_64.tar.gz")"
      - name: Validate the Formula on macOS
        working-directory: homebrew-asterline
        shell: bash
        run: |
          set -euo pipefail
          brew style Formula/asterline.rb
          brew install --formula ./Formula/asterline.rb
          brew test asterline
      - name: Commit and open Formula pull request
        working-directory: homebrew-asterline
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          branch="automation/asterline-v$version"
          git checkout -B "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/asterline.rb
          git diff --cached --quiet && exit 0
          git commit -m "asterline $version"
          git push --force origin "$branch"
          existing_pr=$(gh pr list \
            --repo song0705/homebrew-asterline \
            --base main \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url')
          if test -z "$existing_pr"; then
            gh pr create \
              --repo song0705/homebrew-asterline \
              --base main \
              --head "$branch" \
              --title "asterline $version" \
              --body "Automated Formula update for Asterline v$version."
          fi
