name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  quality:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Match tag to Cargo version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependencies
        run: cargo audit

  quality-platforms:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-15
          - name: Windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Test all targets
        run: cargo test --all-targets --locked

  build:
    name: Build ${{ matrix.target }}
    needs: [quality, quality-platforms]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-${{ matrix.target }}
      - name: Build release binaries
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          package="asterline-${version}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/asterline" "dist/$package/"
          cp "target/${{ matrix.target }}/release/ast" "dist/$package/"
          cp LICENSE README.md README.zh-CN.md "dist/$package/"
          strip "dist/$package/asterline" "dist/$package/ast"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          rm -rf "dist/$package"
      - name: Package Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $package = "asterline-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/asterline.exe" "dist/$package/"
          Copy-Item "target/${{ matrix.target }}/release/ast.exe" "dist/$package/"
          Copy-Item LICENSE, README.md, README.zh-CN.md "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"
          Remove-Item -Recurse -Force "dist/$package"
      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          ./scripts/build-windows-installer.ps1 -Version $version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          retention-days: 7

  package-macos:
    name: Package universal macOS DMG
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-apple-darwin
          path: dist/macos-input
          merge-multiple: true
      - name: Prepare optional Developer ID signing
        shell: bash
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          echo "ASTERLINE_MACOS_SIGNED=0" >> "$GITHUB_ENV"
          if test -z "$CERTIFICATE_P12_BASE64"; then
            echo "Developer ID credentials are not configured; building an unsigned DMG."
            exit 0
          fi
          for value in "$CERTIFICATE_PASSWORD" "$APPLICATION_IDENTITY" "$INSTALLER_IDENTITY"; do
            if test -z "$value"; then
              echo "Incomplete Developer ID signing configuration." >&2
              exit 1
            fi
          done
          encoded="$RUNNER_TEMP/asterline-certificate.txt"
          certificate="$RUNNER_TEMP/asterline-certificate.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" > "$encoded"
          base64 --decode -i "$encoded" -o "$certificate"
          keychain="$RUNNER_TEMP/asterline-signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          echo "ASTERLINE_MACOS_APPLICATION_IDENTITY=$APPLICATION_IDENTITY" >> "$GITHUB_ENV"
          echo "ASTERLINE_MACOS_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          echo "ASTERLINE_MACOS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "ASTERLINE_MACOS_SIGNED=1" >> "$GITHUB_ENV"
      - name: Build universal installer DMG
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          x86_dir="$RUNNER_TEMP/asterline-x86_64"
          arm_dir="$RUNNER_TEMP/asterline-arm64"
          mkdir -p "$x86_dir" "$arm_dir"
          tar -xzf \
            "dist/macos-input/asterline-$version-x86_64-apple-darwin.tar.gz" \
            -C "$x86_dir" --strip-components 1
          tar -xzf \
            "dist/macos-input/asterline-$version-aarch64-apple-darwin.tar.gz" \
            -C "$arm_dir" --strip-components 1
          ./scripts/build-macos-dmg.sh \
            "$version" \
            "$x86_dir" \
            "$arm_dir" \
            "dist/asterline-$version-macos-universal.dmg"
      - name: Notarize and staple signed DMG
        shell: bash
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          if test "$ASTERLINE_MACOS_SIGNED" != "1"; then
            exit 0
          fi
          for value in "$NOTARY_KEY_P8_BASE64" "$NOTARY_KEY_ID" "$NOTARY_ISSUER_ID"; do
            if test -z "$value"; then
              echo "Signed macOS releases require complete notarization credentials." >&2
              exit 1
            fi
          done
          encoded="$RUNNER_TEMP/asterline-notary-key.txt"
          notary_key="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" > "$encoded"
          base64 --decode -i "$encoded" -o "$notary_key"
          version=${GITHUB_REF_NAME#v}
          dmg="dist/asterline-$version-macos-universal.dmg"
          xcrun notarytool submit "$dmg" \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
      - name: Smoke test DMG and package payload
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          dmg="dist/asterline-$version-macos-universal.dmg"
          mount_point="$RUNNER_TEMP/asterline-dmg"
          expanded="$RUNNER_TEMP/asterline-expanded-pkg"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point"' EXIT
          pkg="$mount_point/Install Asterline.pkg"
          test -f "$pkg"
          pkgutil --expand-full "$pkg" "$expanded"
          for binary in ast asterline; do
            payload_binary="$expanded/Payload/usr/local/bin/$binary"
            test -x "$payload_binary"
            lipo "$payload_binary" -verify_arch x86_64 arm64
            "$payload_binary" --help > /dev/null
          done
          hdiutil detach "$mount_point"
          trap - EXIT
      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if test -n "${ASTERLINE_MACOS_KEYCHAIN:-}"; then
            security delete-keychain "$ASTERLINE_MACOS_KEYCHAIN"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build, package-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip *.exe *.dmg > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.dmg
            dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if test -f "$notes_file"; then
            notes=(--notes-file "$notes_file")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${notes[@]}" \
            --title "Asterline $GITHUB_REF_NAME"
